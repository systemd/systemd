<busconfig>

        <policy user="systemd-rtwatch">
                <allow own="org.freedesktop.RealtimeKit1"/>
                <allow send_destination="org.freedesktop.RealtimeKit1"/>
                <allow receive_sender="org.freedesktop.RealtimeKit1"/>
        </policy>

        <policy user="root">
                <allow send_destination="org.freedesktop.RealtimeKit1"/>
                <allow receive_sender="org.freedesktop.RealtimeKit1"/>
        </policy>

        <policy context="default">
                <deny send_destination="org.freedesktop.RealtimeKit1"/>

                <!-- Generic interfaces -->

                <allow send_destination="org.freedesktop.RealtimeKit1"
                       send_interface="org.freedesktop.DBus.Introspectable"/>

                <allow send_destination="org.freedesktop.RealtimeKit1"
                       send_interface="org.freedesktop.DBus.Peer"/>

                <allow send_destination="org.freedesktop.RealtimeKit1"
                       send_interface="org.freedesktop.DBus.Properties"
                       send_member="Get"/>

                <allow send_destination="org.freedesktop.RealtimeKit1"
                       send_interface="org.freedesktop.DBus.Properties"
                       send_member="GetAll"/>

                <!-- RealtimeKit interface -->

                <allow send_destination="org.freedesktop.RealtimeKit1"
                       send_interface="org.freedesktop.RealtimeKit1"
                       send_member="MakeThreadRealtime"/>

                <allow send_destination="org.freedesktop.RealtimeKit1"
                       send_interface="org.freedesktop.RealtimeKit1"
                       send_member="MakeThreadRealtimeWithPID"/>

                <allow send_destination="org.freedesktop.RealtimeKit1"
                       send_interface="org.freedesktop.RealtimeKit1"
                       send_member="MakeThreadHighPriority"/>

                <allow send_destination="org.freedesktop.RealtimeKit1"
                       send_interface="org.freedesktop.RealtimeKit1"
                       send_member="MakeThreadHighPriorityWithPID"/>

                <allow send_destination="org.freedesktop.RealtimeKit1"
                       send_interface="org.freedesktop.RealtimeKit1"
                       send_member="ResetKnown"/>

                <allow send_destination="org.freedesktop.RealtimeKit1"
                       send_interface="org.freedesktop.RealtimeKit1"
                       send_member="ResetAll"/>

                <allow send_destination="org.freedesktop.RealtimeKit1"
                       send_interface="org.freedesktop.RealtimeKit1"
                       send_member="Suspend"/>

                <allow send_destination="org.freedesktop.RealtimeKit1"
                       send_interface="org.freedesktop.RealtimeKit1"
                       send_member="Resume"/>

                <allow receive_sender="org.freedesktop.RealtimeKit1"/>
        </policy>

</busconfig>
