#
# Entries in this file show the compile time defaults. Local configuration
# should be created by either modifying this file (or a copy of it placed in
# /etc/ if the original file is shipped in /usr/), or by creating "drop-ins" in
# the /etc/systemd/rtwatchd.conf.d/ directory. The latter is generally
# recommended. Defaults can be restored by simply deleting the main
# configuration file and all drop-ins located in /etc/.
#
# Use 'systemd-analyze cat-config systemd/rtwatchd.conf' to display the full config.
#
# See rtwatchd.conf(5) for details

[RTWatch]
#SchedulingPolicy=rr
#OurRealtimePriority=21
#OurNiceLevel=1
#MaxRealtimePriority=20
#MinNiceLevel=-15
#RTTimeMax=200ms
#UsersMax=2048
#ProcessesPerUserMax=15
#ThreadsPerUserMax=25
#ActionsBurstSec=20s
#ActionsPerBurstMax=25
#Canary=yes
#CanaryCheepSec=5s
#CanaryWatchdogSec=10s
#CanaryRefuseSec=5min
#CanaryDemoteRoot=no
#CanaryDemoteUnknown=no
