name: PR 43633 move NEWS entries to v263

on:
  push:
    branches:
      - fix/configuration-directory-flags-dbus
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/configuration-directory-flags-dbus
          fetch-depth: 1

      - name: Move NEWS entries from 262 to 263
        shell: python
        run: |
          from pathlib import Path

          path = Path("NEWS")
          text = path.read_text()

          old_heading = "CHANGES WITH 262 in spe:"
          new_heading = "CHANGES WITH 263 in spe:"
          needles = (
              "ConfigurationDirectory= passed as a transient-unit property",
              "DirectorySymlink D-Bus properties now reject source and",
          )

          if new_heading in text:
              print("NEWS already contains the v263 section; nothing to do.")
              raise SystemExit(0)

          old_pos = text.index(old_heading)
          next_section = text.find("\nCHANGES WITH ", old_pos + len(old_heading))
          if next_section < 0:
              next_section = len(text)

          ranges = []
          blocks = []
          for needle in needles:
              pos = text.index(needle, old_pos, next_section)
              start = text.rfind("\n        * ", old_pos, pos)
              if start < 0:
                  raise RuntimeError(f"Could not find bullet start for {needle!r}")
              start += 1

              next_bullet = text.find("\n        * ", pos, next_section)
              end = next_bullet + 1 if next_bullet >= 0 else next_section
              block = text[start:end].rstrip("\n")
              ranges.append((start, end))
              blocks.append(block)

          if ranges[0][0] == ranges[1][0]:
              raise RuntimeError("Matched the same NEWS bullet twice")

          for start, end in sorted(ranges, reverse=True):
              text = text[:start] + text[end:]

          insert_at = text.index(old_heading)
          section = new_heading + "\n\n" + "\n\n".join(blocks) + "\n\n"
          text = text[:insert_at] + section + text[insert_at:]

          if text.count(new_heading) != 1:
              raise RuntimeError("Unexpected v263 heading count")
          p263 = text.index(new_heading)
          p262 = text.index(old_heading)
          if not p263 < p262:
              raise RuntimeError("v263 section was not inserted before v262")
          for needle in needles:
              p = text.index(needle)
              if not p263 < p < p262:
                  raise RuntimeError(f"{needle!r} is not inside the v263 section")

          path.write_text(text)

      - name: Commit NEWS update
        shell: bash
        run: |
          if git diff --quiet -- NEWS; then
            echo "No NEWS change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NEWS
          git commit -m "NEWS: move directory D-Bus changes to v263"
          git push origin HEAD:fix/configuration-directory-flags-dbus
