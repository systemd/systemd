---
# SPDX-License-Identifier: LGPL-2.1-or-later
name: coverage

on:
  schedule:
    # Calculate coverage daily at midnight
    - cron:  '0 0 * * *'

  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/coverage.yml
      - test/integration-tests/integration-test-wrapper.py
      - src/boot/efi-gcov.c
      - tools/run-efi-coverage.sh

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    if: github.repository == 'systemd/systemd' || github.repository == 'systemd/systemd-stable'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: systemd/mkosi@131adaca5eb5f1551bc564ae4497ff940890a374

      # Freeing up disk space with rm -rf can take multiple minutes. Since we don't need the extra free space
      # immediately, we remove the files in the background. However, we first move them to a different location
      # so that nothing tries to use anything in these directories anymore while we're busy deleting them.
      - name: Free disk space
        run: |
          sudo mv /usr/local /usr/local.trash
          sudo mv /opt/hostedtoolcache /opt/hostedtoolcache.trash
          sudo systemd-run rm -rf /usr/local.trash /opt/hostedtoolcache.trash

      - name: Btrfs
        run: |
          truncate --size=100G btrfs.raw
          mkfs.btrfs btrfs.raw
          sudo mkdir /mnt/mkosi
          LOOP="$(sudo losetup --find --show --direct-io=on btrfs.raw)"
          sudo mount "$LOOP" /mnt/mkosi --options compress=zstd:1,user_subvol_rm_allowed,noatime,discard=async,space_cache=v2
          sudo chown "$(id -u):$(id -g)" /mnt/mkosi
          mkdir /mnt/mkosi/tmp
          echo "TMPDIR=/mnt/mkosi/tmp" >>"$GITHUB_ENV"
          ln -s /mnt/mkosi/build build

      - name: Configure
        run: |
          tee mkosi/mkosi.local.conf <<EOF
          [Distribution]
          Distribution=arch

          [Build]
          ToolsTreeDistribution=arch
          # The pinned tools tree (mkosi.tools.manifest) already ships the
          # OVMF/QEMU/mtools/dosfstools the EFI coverage runner below needs;
          # gdisk is the one missing dependency. The runner prefers GPT
          # partitioning because OVMF only exposes partition objects for GPT
          # disks, which the stub needs to find the ESP and exercise the
          # random seed / boot secret / config paths (without sgdisk it
          # falls back to MBR and still runs, but loses ~480 covered lines).
          ToolsTreePackages=gdisk
          UseSubvolumes=yes
          WithTests=no

          WorkspaceDirectory=$TMPDIR
          PackageCacheDirectory=$TMPDIR/cache

          Environment=
                  # Build debuginfo packages since we'll be publishing the packages as artifacts.
                  WITH_DEBUG=1
                  CFLAGS=-Og
                  MESON_OPTIONS=--werror
                  COVERAGE=1

          [Runtime]
          RAM=4G
          EOF

      - name: Generate secure boot key
        run: mkosi --debug genkey

      - name: Show image summary
        run: mkosi summary

      - name: Build tools tree
        run: sudo mkosi -f box -- true

      - name: Configure meson
        run: |
          # Instrument the EFI boot binaries so that tools/run-efi-coverage.sh
          # can capture their gcda counter files (see the step below).
          sudo mkosi box -- \
            meson setup \
            --buildtype=debugoptimized \
            -Defi-coverage=true \
            build

      - name: Build image
        run: sudo mkosi box -- meson compile -C build mkosi

      - name: Initial coverage report
        run: |
          sudo mkdir -p build/test/coverage
          sudo mkosi box -- \
            lcov \
            --directory build/mkosi.builddir/arch~rolling~x86-64 \
            --capture \
            --initial \
            --exclude "*.gperf" \
            --output-file build/test/coverage/initial.coverage-info \
            --base-directory src/ \
            --ignore-errors source \
            --no-external \
            --substitute "s#src/src#src#g"

      - name: Run integration tests
        run: |
          # --preserve-env makes sure all the github actions environment variables are propagated which are
          # used in integration-test-wrapper.py to construct the `gh` command line to download the journals
          # of failed tests.
          sudo --preserve-env mkosi box -- \
            env \
            TEST_RUNNER=ubuntu-24.04 \
            meson test \
            -C build \
            --no-rebuild \
            --setup=integration \
            --suite=integration-tests \
            --print-errorlogs \
            --no-stdsplit \
            --num-processes "$(($(nproc) - 1))" \
            --timeout-multiplier 2 \
            --max-lines 300 \
            --quiet

      - name: Run EFI coverage
        run: |
          # The boot manager and the stub are part of the native build above;
          # build them explicitly so the .efi files match the .gcno notes,
          # then boot both under OVMF in QEMU (TCG, no KVM in the container)
          # and capture the gcda counter files they write to the ESP. The
          # runner produces one TEST-efi-*.coverage-info tracefile per
          # scenario in build/test/coverage, which the "Combine coverage
          # reports" step picks up like any other TEST-*.coverage-info file.
          # --mem keeps the guest small in the 4G box. The runner's gdisk
          # dependency is added to the tools tree by the "Configure" step
          # (ToolsTreePackages=); the OVMF/QEMU/mtools/dosfstools it needs
          # are already in the pinned tools tree (mkosi.tools.manifest).
          # "systemd-boot" is the alias target covering all boot .efi files
          # (the elf2efi outputs are custom targets, not meson target names)
          sudo mkosi box -- meson compile -C build systemd-boot
          sudo mkosi box -- tools/run-efi-coverage.sh both --mem 1024

      - name: Fix journal ownership
        if: failure() && (github.repository == 'systemd/systemd' || github.repository == 'systemd/systemd-stable')
        run: sudo chown -R "$(id -u):$(id -g)" build/test/journal build/meson-logs || true

      - name: Archive failed test journals
        uses: actions/upload-artifact@v7
        if: failure() && (github.repository == 'systemd/systemd' || github.repository == 'systemd/systemd-stable')
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-arch-rolling-failed-test-journals
          path: |
            build/test/journal/*.journal
            build/meson-logs/*
          retention-days: 7

      - name: Combine coverage reports
        run: |
          lcov_args=()

          while read -r file; do
              lcov_args+=(--add-tracefile "${file}")
          done < <(find build/test/coverage -name "TEST-*.coverage-info")

          sudo mkosi box -- lcov --ignore-errors inconsistent,inconsistent "${lcov_args[@]}" --output-file build/test/coverage/everything.coverage-info

      - name: List coverage report
        run: sudo mkosi box -- lcov --ignore-errors inconsistent,inconsistent --list build/test/coverage/everything.coverage-info

      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        if: github.repository == 'systemd/systemd' || github.repository == 'systemd/systemd-stable'
        with:
          file: build/test/coverage/everything.coverage-info
