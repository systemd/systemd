---
# vi: ts=2 sw=2 et:
# SPDX-License-Identifier: LGPL-2.1-or-later
#
name: "Pull Request Labeler"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  # Allow testing changes made to the labeler configuration
  pull_request:
    paths:
      - '.github/labeler.json'
      - '.github/workflows/labeler.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  triage:
    if: github.repository == 'systemd/systemd'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write

    env:
      # The pull_request trigger is only there to check a change to the
      # configuration against the head copy, so it never writes: a fork gets a
      # read-only token whatever the permissions above say, and pull_request_target
      # runs for the same pull request, so the two would fight over the labels.
      SELF_TEST: ${{ github.event_name == 'pull_request' }}

    steps:
    - name: Repository checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: github.event_name == 'pull_request'
      with:
        persist-credentials: false

    - name: Label PR based on policy in labeler.json
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      if: startsWith(github.event_name, 'pull_request') && github.base_ref == 'main' && github.event.action != 'closed'
      with:
        script: |
          const fs = require("fs");

          const CONFIG = ".github/labeler.json";

          /* A pattern is a literal path in which "*" stands for any run of
           * characters, "/" included. That makes "src/home*" cover everything
           * below src/home/ and "*meson.build" every meson.build in the tree,
           * which is what the patterns were always meant to say. */
          const compile = (glob) =>
            new RegExp(`^${glob.split("*").map(p => p.replace(/[.^$+|?()[\]{}\\]/g, "\\$&")).join(".*")}$`);

          /* The pull_request trigger checks the branch out so that changes to
           * the configuration can be tested. pull_request_target does not, so
           * read the base repository's copy through the API instead. */
          let raw;
          if (context.eventName == "pull_request") {
            raw = fs.readFileSync(CONFIG, "utf8");
          } else {
            const content = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: CONFIG,
            });
            raw = Buffer.from(content.data.content, "base64").toString();
          }

          const config = JSON.parse(raw);

          const changed = (await github.paginate(github.rest.pulls.listFiles, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          })).map(f => f.filename);

          const matched = Object.entries(config.labels)
            .filter(([, globs]) => globs.map(compile).some(re => changed.some(f => re.test(f))))
            .map(([label]) => label);

          const response = await github.rest.issues.listLabelsOnIssue({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });

          const present = new Set(response.data.map(l => l.name));

          /* A pull request touching half the tree matches so many labels that
           * none of them say anything about it, so say that much instead. The
           * count is of everything that matched rather than of what is missing,
           * so that a rerun on the same pull request decides the same way. */
          const tooMany = matched.length > config["max-labels"];
          const wanted = tooMany ? [config["too-many-labels"]] : matched;

          /* The two outcomes exclude each other, so a push that crosses the limit
           * in either direction has to take the other one's labels back off. */
          const labels = wanted.filter(l => !present.has(l));
          const stale = (tooMany ? matched : [config["too-many-labels"]])
            .filter(l => present.has(l));

          if (labels.length == 0 && stale.length == 0) {
            core.info("Labels are already up to date");
          } else if (process.env.SELF_TEST == "true") {
            core.info(`Would add ${labels.join(", ") || "nothing"} and remove ` +
                      `${stale.join(", ") || "nothing"}`);
          } else {
            if (labels.length > 0) {
              /* addLabels() only ever adds, so labels set by another workflow
               * between the calls above and this one survive. */
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: labels,
              });
            }

            for (const label of stale) {
              try {
                await github.rest.issues.removeLabel({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch (error) {
                /* Somebody else removed it first. */
                if (error.status !== 404) {
                  throw error;
                }
              }
            }
          }

    - name: Set or remove labels based on systemd development workflow
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      if: startsWith(github.event_name, 'pull_request') && github.event.action != 'closed' && !github.event.pull_request.draft && env.SELF_TEST != 'true'
      with:
        script: |
          /* Never read the full label set and write it back: other workflows
           * label the same pull request concurrently and setLabels() would
           * clobber whatever they added in the meantime. Only ever add or
           * remove the individual labels this step owns. */
          const removeLabel = async (name) => {
            try {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: name,
              });
            } catch (error) {
              /* Somebody else removed it first. */
              if (error.status !== 404) {
                throw error;
              }
            }
          };

          response = await github.rest.issues.listLabelsOnIssue({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });

          labels = new Set(response.data.map(l => l.name));

          good_to_merge = new Set([
            "good-to-merge/waiting-for-ci 👍",
            "good-to-merge/after-next-release",
            "good-to-merge/with-minor-suggestions",
            "good-to-merge/waiting-for-reporter-feedback 👍",
          ]);

          /* A README.md that still carries the AI review notice has not been
           * looked at by its author yet, so nobody else should review it. */
          const readme = await github.rest.repos.getContent({
            owner: context.repo.owner,
            repo: context.repo.repo,
            path: "README.md",
            ref: context.payload.pull_request.head.sha,
          });
          const unreviewed = Buffer.from(readme.data.content, "base64").toString()
            .includes("Remove this line to confirm you've reviewed this PR before submitting.");

          if (unreviewed) {
            /* Only GraphQL can do this. The author marks the PR ready again once
             * the notice is gone, which triggers the labeling below. */
            await github.graphql(`
              mutation($id: ID!) {
                convertPullRequestToDraft(input: { pullRequestId: $id }) {
                  pullRequest { isDraft }
                }
              }
            `, { id: context.payload.pull_request.node_id });
          } else if (!Array.from(good_to_merge).some(l => labels.has(l)) && !labels.has("please-review")) {
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ["please-review"],
            });
          }

          for (const label of ["reviewed/needs-rework 🔨",
                               "ci-fails/needs-rework 🔥",
                               "ci-failure-appears-unrelated",
                               "needs-rebase"]) {
            if (labels.has(label)) {
              await removeLabel(label);
            }
          }

    - name: Add please-review label on command in issue comment
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      if: github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/please-review')
      with:
        script: |
          await github.rest.issues.addLabels({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: ["please-review"]
          })

    - name: Remove specific labels when PR is closed or merged
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      if: startsWith(github.event_name, 'pull_request') && github.event.action == 'closed'
      with:
        script: |
          response = await github.rest.issues.listLabelsOnIssue({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });

          labels = new Set(response.data.map(l => l.name));

          for (const label of ["please-review",
                               "reviewed/needs-rework 🔨",
                               "ci-fails/needs-rework 🔥",
                               "needs-rebase",
                               "good-to-merge/waiting-for-ci 👍",
                               "good-to-merge/after-next-release",
                               "good-to-merge/with-minor-suggestions",
                               "good-to-merge/waiting-for-reporter-feedback 👍",
                               "needs-discussion 🤔",
                               "needs-reporter-feedback ❓",
                               "dont-merge 💣",
                               "squash-on-merge",
                               "quick-review 🏃‍♂️"]) {
            if (!labels.has(label)) {
              continue;
            }

            try {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (error) {
              /* Somebody else removed it first. */
              if (error.status !== 404) {
                throw error;
              }
            }
          }
