name: PR 43633 one-shot fix

on:
  push:
    branches:
      - fix/configuration-directory-flags-dbus

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/configuration-directory-flags-dbus
          fetch-depth: 0

      - name: Apply reviewed fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/core/dbus-execute.c")
          text = path.read_text()
          old = '                                                destination ? ":" : "",'
          new = '                                                destination || !isempty(flags_string) ? ":" : "",'

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one target line, found {count}")

          path.write_text(text.replace(old, new, 1))
          PY

          git rm .github/workflows/pr43633-one-shot-fix.yml
          git add src/core/dbus-execute.c
          git diff --cached --check

          git config user.name "umutcagand"
          git config user.email "c8dhjp4tyv@privaterelay.appleid.com"
          git commit -m "core: preserve separator for flags-only directory tuples"
          git push origin HEAD:fix/configuration-directory-flags-dbus
