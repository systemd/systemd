# See tmpfiles.d(5) for details.

# The NOCOW attribute is inherited by new files and subdirectories on btrfs.
# Classic journal files retain it to reduce writes to scattered locations.
# Segmented journal files clear it to keep btrfs checksums and compression.
#
# NOCOW disables btrfs checksums. Redundant btrfs filesystems need checksums
# to repair corrupted files.

h /var/log/journal - - - - +C
h /var/log/journal/%m - - - - +C
h /var/log/journal/remote - - - - +C
