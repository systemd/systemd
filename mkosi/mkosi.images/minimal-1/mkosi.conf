[Config]
Dependencies=minimal-base

[Output]
Format=portable
# Use our own repart definitions, see minimal.repart/ for details.
RepartDirectories=%D/mkosi/minimal.repart
SplitArtifacts=yes

[Build]
Environment=SYSTEMD_REPART_OVERRIDE_FSTYPE=squashfs

[Content]
BaseTrees=%O/minimal-base
Bootable=no
