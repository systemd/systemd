[Config]
Dependencies=minimal-base

[Output]
# Not Format=portable, so that we can use our own repart definitions, see minimal.repart/ for details.
Format=disk
RepartDirectories=%D/mkosi/minimal.repart
ElTorito=no
SplitArtifacts=yes

[Build]
Environment=SYSTEMD_REPART_OVERRIDE_FSTYPE=squashfs

[Content]
BaseTrees=%O/minimal-base
Bootable=no
