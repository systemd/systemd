# Trusts unsigned addons on first use, see TEST-86-MULTI-PROFILE-UKI.
[UKIProfile]
Profile=
        ID=tofu
        TITLE=Trust Addons On First Use
        TOFU=test.tofu
# Without dm_verity.keyring_unsealed=1 the kernel seals the .dm-verity keyring while it is empty. The test
# needs systemd-keyring-setup to enroll the certificate from its key addon into that keyring.
Cmdline=testprofiletofu=1 dm_verity.keyring_unsealed=1
