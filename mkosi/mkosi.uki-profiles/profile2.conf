# The mixed case ID checks that entry IDs are matched case insensitively. PCRLOCK=yes makes
# systemd-pcrlock lock-uki generate a .pcrlock file for the profile, see TEST-86-MULTI-PROFILE-UKI.
[UKIProfile]
Profile=
        ID=Profile2
        TITLE=Profile Two
        PCRLOCK=yes
Cmdline=testprofile2=1
