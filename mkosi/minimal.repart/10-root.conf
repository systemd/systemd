# The split out root partition of the minimal images is used as bare file system image (with external
# Verity data), hence it must not carry any GPT validatefs constraints, which can only be fulfilled if it is
# placed on a GPT partition.

[Partition]
Type=root
Format=erofs
CopyFiles=/
Verity=data
VerityMatchKey=root
Minimize=best
AddValidateFS=no
