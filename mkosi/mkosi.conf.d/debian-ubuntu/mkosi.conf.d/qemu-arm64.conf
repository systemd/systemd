# QEMU and its firmware for the tests that boot guests with systemd-vmspawn. The other distributions get
# them through the recommends of their systemd packaging, Debian's doesn't list them.

[Match]
Architecture=arm64

[Content]
Packages=
        qemu-efi-aarch64
        qemu-system-arm
