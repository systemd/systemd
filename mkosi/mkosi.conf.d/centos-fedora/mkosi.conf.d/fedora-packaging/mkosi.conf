# The Fedora packaging splits systemd-imds out of systemd and systemd-import-keys out of
# systemd-container. The Hyperscale packaging keeps the files in systemd and systemd-container.

[Match]
Profiles=!hyperscale

[Content]
VolatilePackages=
        systemd-imds
        systemd-import-keys
