{
    "Dhcp6": {
        "interfaces-config": {
            "interfaces": [ "veth-peer" ]
        },

        # Keep all state in memory, so that nothing needs to be written outside of the test directory,
        # and each invocation starts without any leases.
        "lease-database": {
            "type": "memfile",
            "persist": false
        },
        "server-id": {
            "type": "LL",
            "htype": 1,
            "identifier": "123456789abd",
            "persist": false
        },

        "valid-lifetime": 2592000,
        "preferred-lifetime": 604800,
        "renew-timer": 3600,
        "rebind-timer": 7200,

        "option-data": [
            {
                "name": "dns-servers",
                "data": "3ffe:501:ffff:100:200:ff:fe00:3f3e"
            },
            {
                "name": "domain-search",
                "data": "test.example.com, example.com"
            },
            {
                "name": "information-refresh-time",
                "data": "21600"
            }
        ],

        "subnet6": [
            {
                "id": 1,
                "subnet": "3ffe:501:ffff:100::/64",
                "interface": "veth-peer",

                # Addresses available to clients
                "pools": [
                    {
                        "pool": "3ffe:501:ffff:100::10 - 3ffe:501:ffff:100::100"
                    }
                ],

                # Some /56 prefixes available for Prefix Delegation (RFC 3633)
                "pd-pools": [
                    {
                        "prefix": "3ffe:501:fffe:200::",
                        "prefix-len": 55,
                        "delegated-len": 56
                    },
                    {
                        "prefix": "3ffe:501:fffe:400::",
                        "prefix-len": 54,
                        "delegated-len": 56
                    },
                    {
                        "prefix": "3ffe:501:fffe:800::",
                        "prefix-len": 53,
                        "delegated-len": 56
                    }
                ]
            }
        ]
    }
}
